      - run: dev-exec just test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-logs
          path: test-logs/
          retention-days: 30

  # Cross-compile gate run from a Linux host: `nim check --os:windows`
  # parses and type-checks the M10 WindowsDriver code path. Catches
  # Windows-side regressions early without waiting on the (slower)
  # Windows runner. Mirrors nim-termctl's check-windows-cross lane.
  check-windows-cross:
    name: Check (Windows cross from Linux) (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: dev-exec just check-windows-cross
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-windows-cross-logs-${{ matrix.runner }}
          path: test-logs/
          retention-days: 30

  test-windows:
    name: Test (Windows) (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-win-x64, eph-win-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.4'
      - name: Install just
        run: choco install just -y
      - name: Run Windows test lane
        run: just test-windows
        shell: cmd
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs-${{ matrix.runner }}
          path: test-logs/
          retention-days: 30

  nix-build:
    name: nix build (${{ matrix.runner }})
    strategy:
      fail-fast: false
