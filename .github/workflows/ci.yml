name: CI

# Every job here compiles against sibling repositories that are NOT part of
# this checkout: the Justfile's `src-paths` / `real-terminal-paths` and
# `config.nims` carry `--path:../<repo>/...` for each entry in
# `.github/sibling-repos`. A bare `actions/checkout@v4` put none of them on
# disk, so `nim check` / `nim c` resolved no cross-repo import and every
# recipe failed -- silently, because the recipes pipe into `tee` and just's
# default shell has no pipefail (fixed separately in the Justfile). Measured
# on run 29056929571, 18 of 20 jobs reported success over tens of thousands
# of "cannot open file" errors.
#
# Siblings are cloned by `setup-dev-env`, which delegates to `clone-siblings`
# and resolves each name in `.github/sibling-repos` against the per-commit
# workspace lock in the manifest repo. That lock is the single source of
# sibling revisions for CI; a second hand-pinned `actions/checkout` would be another place for revisions to
# drift away from what the workspace actually builds.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches-ignore: [agents]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (${{ join(matrix.runner, '-') }})
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    # A hung job must not hold a scarce runner for GitHub's 6-hour default. Each budget is the
    # worst PASSING duration seen per runner class (jobs API, last ~60 runs of this branch and
    # dev, through b5e896e, 2026-11-22; `self-hosted-macos-arm64` covers both garm VMs and the
    # m3 hosts) times about 2. Runs on an overloaded host are not sized to: see the macOS note
    # on `charter-matrix`.
    # Worst pass: 16m48s (linux-x64), 7m49s (linux-arm64), 7m17s (macOS garm), 6m52s (m3) -> 60.
    timeout-minutes: 60
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: dev-exec just lint
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-logs-${{ join(matrix.runner, '-') }}
          path: test-logs/
          retention-days: 30

  test:
    name: Test (orc/release/threads:on) (${{ join(matrix.runner, '-') }})
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    # A hung job must not hold a scarce runner for GitHub's 6-hour default. Each budget is the
    # worst PASSING duration seen per runner class (jobs API, last ~60 runs of this branch and
    # dev, through b5e896e, 2026-11-22; `self-hosted-macos-arm64` covers both garm VMs and the
    # m3 hosts) times about 2. Runs on an overloaded host are not sized to: see the macOS note
    # on `charter-matrix`.
    # Worst pass: linux-x64 303m34s -> 480 (1.6x: the slowest shared host), linux-arm64 54m38s
    # -> 150, macOS 64m42s (m3) -> 130.
    timeout-minutes: ${{ matrix.runner[1] == 'macos' && 130 || (matrix.runner[2] == 'arm64' && 150 || 480) }}
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: dev-exec just test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ join(matrix.runner, '-') }}
          path: test-logs/
          retention-days: 30

  test-real-terminal:
    name: Test (real terminal — M29) (${{ join(matrix.runner, '-') }})
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    # A hung job must not hold a scarce runner for GitHub's 6-hour default. Each budget is the
    # worst PASSING duration seen per runner class (jobs API, last ~60 runs of this branch and
    # dev, through b5e896e, 2026-11-22; `self-hosted-macos-arm64` covers both garm VMs and the
    # m3 hosts) times about 2. Runs on an overloaded host are not sized to: see the macOS note
    # on `charter-matrix`.
    # Worst pass: 23m05s (linux-x64), 8m25s (m3), 6m14s (macOS garm), 6m31s (linux-arm64) -> 60.
    timeout-minutes: 60
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: dev-exec just test-real-terminal
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-terminal-logs-${{ join(matrix.runner, '-') }}
          path: test-logs/
          retention-days: 30

  cross-emulator:
    name: Test (cross-emulator — M29 follow-up) (${{ join(matrix.runner, '-') }})
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    # A hung job must not hold a scarce runner for GitHub's 6-hour default. Each budget is the
    # worst PASSING duration seen per runner class (jobs API, last ~60 runs of this branch and
    # dev, through b5e896e, 2026-11-22; `self-hosted-macos-arm64` covers both garm VMs and the
    # m3 hosts) times about 2. Runs on an overloaded host are not sized to: see the macOS note
    # on `charter-matrix`.
    # Worst pass: 5m18s (linux-x64), 3m23s (m3). An m3 job also spends up to ~2 min in setup and
    # up to ~7.5 min in "Complete job" -> about 13 min in all -> 30. (The b5e896e run's
    # 31.7 min, 20 of them in setup, is the overloaded-host case noted on `charter-matrix`.)
    timeout-minutes: 30
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: dev-exec just test-cross-emulator
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-emulator-logs-${{ join(matrix.runner, '-') }}
          path: test-logs/
          retention-days: 30

  charter-matrix:
    name: Charter (${{ matrix.mm }}/${{ matrix.mode }}/threads:${{ matrix.threads }}) (${{ join(matrix.runner, '-') }})
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
        mm: [arc, orc, refc]
        mode: [debug, release, danger]
        # `on` only. isonim-tui's drivers are built on a reader thread and
        # `system.Channel`, so `--threads:off` is unsupported by design --
        # not a failure being hidden -- and `src/isonim_tui.nim` refuses to
        # compile without threads.
        threads: [on]
    runs-on: ${{ matrix.runner }}
    # A hung job must not hold a scarce runner for GitHub's 6-hour default. Each budget is the
    # worst PASSING duration seen per runner class (jobs API, last ~60 runs of this branch and
    # dev, through b5e896e, 2026-11-22; `self-hosted-macos-arm64` covers both garm VMs and the
    # m3 hosts) times about 2. Runs on an overloaded host are not sized to: see the macOS note
    # on `charter-matrix`.
    # Worst pass: linux-x64 213m07s -> 360, linux-arm64 31m27s -> 90, macOS 47m00s (m3) -> 120.
    # On m3 a test compiles in 2.6-12.3 s and setup takes 0.5-2 min (every m3 Charter/Test job
    # logged from 5a7be5b to 449699b). The b5e896e run was not like that: setup took 13-20 min
    # and m3-mcl-bench-001 compiled at 40.6 s per test, m3-mcl-001 at 18.2 s; that is a host
    # problem, and no budget here is sized to it.
    timeout-minutes: ${{ matrix.runner[1] == 'macos' && 120 || (matrix.runner[2] == 'arm64' && 90 || 360) }}
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: dev-exec just _matrix ${{ matrix.mm }} ${{ matrix.mode }} ${{ matrix.threads }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charter-${{ matrix.mm }}-${{ matrix.mode }}-${{ matrix.threads }}-${{ join(matrix.runner, '-') }}-logs
          path: test-logs/
          retention-days: 30

  # ThreadSanitizer and valgrind are deliberately NOT gates here. Both fail on
  # every Nim program of the shape this repository is made of, so neither can
  # tell a defect in this code from a property of the Nim runtime. The
  # `just test-tsan` and `just test-valgrind` recipes stay, as local
  # diagnostics whose reports have to be read, not counted.
  #
  # ThreadSanitizer. A program of a dozen lines -- one thread sends integers
  # over a `system.Channel`, the main thread polls it with `tryRecv`, then
  # joins the thread and calls `close` -- produces the same two reports on
  # every run (Nim 2.2.4, clang, `--mm:orc --threads:on`), and so does every
  # threaded driver test here:
  #   - a data race on the channel's `mask` field: `tryRecv`, `peek` and
  #     `send` read it before taking the channel lock, while a `send` that
  #     grows the queue writes it under the lock
  #     (lib/system/channels_builtin.nim);
  #   - "destroy of a locked mutex": `close` acquires the channel lock and
  #     destroys it without releasing it.
  # Both are inside the standard library. Suppressing them would also hide a
  # race of ours that happened to pass through the channel.
  #
  # Valgrind. A four-line program that imports `std/unittest` and runs one
  # passing `check`, built with `--mm:orc -d:useMalloc`, fails
  # `--leak-check=full --show-leak-kinds=all --error-exitcode=1` with
  # 0 bytes definitely lost and one block "possibly lost": the formatter that
  # `std/unittest` keeps in a thread-local list until exit. The same happens
  # for any `ref` held by a threadvar or another global that is not destroyed
  # at exit. An ORC `ref` points just past the reference-count header at the
  # start of its allocation, so valgrind sees only an interior pointer to a
  # block that is still reachable, and classifies it "possibly lost". Every
  # test here links `std/unittest`, so every test fails the same way.
  #
  # Leak detection is gated by `lsan` and memory errors by `asan` below.
  sanitizers:
    name: Sanitizer (${{ matrix.kind }})
    # Linux-only (clang sanitizers); mapped to the Linux AMD64 Nix class.
    runs-on: [self-hosted, linux, x64]
    # A hung job must not hold a scarce runner for GitHub's 6-hour default. Each budget is the
    # worst PASSING duration seen per runner class (jobs API, last ~60 runs of this branch and
    # dev, through b5e896e, 2026-11-22; `self-hosted-macos-arm64` covers both garm VMs and the
    # m3 hosts) times about 2. Runs on an overloaded host are not sized to: see the macOS note
    # on `charter-matrix`.
    # Worst pass: asan 249m05s, ubsan 176m12s, lsan 126m13s; lsan at 6d0cc91 was still making
    # progress after 5 h (126 of 163 tests), which projects to about 6.5 h on a loaded host -> 480.
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        kind: [asan, ubsan, lsan]
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: dev-exec just test-${{ matrix.kind }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.kind }}-logs
          path: test-logs/
          retention-days: 30

  test-macos:
    name: Test (macOS)
    runs-on: [self-hosted, macos, arm64]
    # A hung job must not hold a scarce runner for GitHub's 6-hour default. Each budget is the
    # worst PASSING duration seen per runner class (jobs API, last ~60 runs of this branch and
    # dev, through b5e896e, 2026-11-22; `self-hosted-macos-arm64` covers both garm VMs and the
    # m3 hosts) times about 2. Runs on an overloaded host are not sized to: see the macOS note
    # on `charter-matrix`.
    # No passing run yet; it runs the same suite as `test` on macOS, whose worst pass is 64m42s
    # (m3) -> 130.
    timeout-minutes: 130
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: dev-exec just test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-logs
          path: test-logs/
          retention-days: 30

  # Cross-compile gate run from a Linux host: `nim check --os:windows`
  # parses and type-checks the M10 WindowsDriver code path. Catches
  # Windows-side regressions early without waiting on the (slower)
  # Windows runner. Mirrors nim-termctl's check-windows-cross lane.
  check-windows-cross:
    name: Check (Windows cross from Linux) (${{ join(matrix.runner, '-') }})
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    # A hung job must not hold a scarce runner for GitHub's 6-hour default. Each budget is the
    # worst PASSING duration seen per runner class (jobs API, last ~60 runs of this branch and
    # dev, through b5e896e, 2026-11-22; `self-hosted-macos-arm64` covers both garm VMs and the
    # m3 hosts) times about 2. Runs on an overloaded host are not sized to: see the macOS note
    # on `charter-matrix`.
    # Worst pass: 13m08s (linux-x64, checking every test since 51b0b0e), 8m36s (macOS) -> 30.
    timeout-minutes: 30
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: dev-exec just check-windows-cross
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-windows-cross-logs-${{ join(matrix.runner, '-') }}
          path: test-logs/
          retention-days: 30

  test-windows:
    name: Test (Windows) (${{ join(matrix.runner, '-') }})
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, windows, x64], [self-hosted, windows, arm64]]
    runs-on: ${{ matrix.runner }}
    # A hung job must not hold a scarce runner for GitHub's 6-hour default. Each budget is the
    # worst PASSING duration seen per runner class (jobs API, last ~60 runs of this branch and
    # dev, through b5e896e, 2026-11-22; `self-hosted-macos-arm64` covers both garm VMs and the
    # m3 hosts) times about 2. Runs on an overloaded host are not sized to: see the macOS note
    # on `charter-matrix`.
    # Worst pass: windows-x64 68m50s (garm), 31m41s (win-ci-vm), windows-arm64 53m24s -> 140.
    timeout-minutes: 140
    steps:
      # The self-hosted Windows images carry no package manager (there is no
      # `choco`, which is what this job used to call, so it failed before
      # running a test) and no Nix. Windows lanes provision through
      # setup-dev-env instead. This is the reprobuild flavour that
      # ci-reprobuild.yml's Windows legs use, at the same pins: it installs
      # repro, clones the siblings the Justfile's `src-paths` names at the
      # revisions repro.lock pins, and makes `dev-exec` run a command inside
      # the dev env that repro.nim's `uses:` declares (nim and the C
      # compiler among it). The images provide `bash` (PortableGit), which
      # the Justfile's recipes run under.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (reprobuild flavor, as ci-reprobuild.yml)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@8b9f60a18323425b0c81c1769a24bcb9d7cbd037
        with:
          env-flavor: reprobuild
          repro-version: v0.2.29
          sibling-strategy: repro-lock
          gh-token: ${{ steps.app-token.outputs.token }}
      # `just` the way the CI workflow standard installs it on every leg,
      # pinned to the version the Linux dev shell carries.
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.49.0'
      - name: Run Windows test lane
        run: dev-exec just test-windows
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs-${{ join(matrix.runner, '-') }}
          path: test-logs/
          retention-days: 30

  nix-build:
    name: nix build (${{ join(matrix.runner, '-') }})
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    # A hung job must not hold a scarce runner for GitHub's 6-hour default. Each budget is the
    # worst PASSING duration seen per runner class (jobs API, last ~60 runs of this branch and
    # dev, through b5e896e, 2026-11-22; `self-hosted-macos-arm64` covers both garm VMs and the
    # m3 hosts) times about 2. Runs on an overloaded host are not sized to: see the macOS note
    # on `charter-matrix`.
    # Worst pass: 18m33s (linux-x64), 10m48s (m3, 9ea9500) -> 45. The 29m53s on m3-mcl-001 at
    # b5e896e is the overloaded run and is not sized to.
    timeout-minutes: 45
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: nix build .#default
