# CI Benchmark Tracking for isonim-tui (M24).
#
# Runs the benchmark suite on every PR and every push to main, then
# publishes results to gh-pages for historical trend tracking via
# github-action-benchmark.
#
# - On push to main: updates the baseline on gh-pages
# - On pull_request: compares against baseline, posts PR comment, does
#   NOT update baseline
#
# Local equivalent:
#   just bench --quick

name: "Benchmark"
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: benchmark-execution-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark-baseline-store:
    # Orchestration leg (gh-pages baseline prep) on a general Linux
    # ephemeral class; the measurement job stays on [self-hosted, benchmark].
    runs-on: eph-linux-x64
    name: prepare benchmark baseline store
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Ensure gh-pages baseline branch exists
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "PR benchmark run uses the existing gh-pages baseline branch"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "gh-pages baseline branch already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan gh-pages
          if git ls-files --error-unmatch . >/dev/null 2>&1; then
            git rm -rf -- .
          else
            echo "No tracked files to remove from orphan gh-pages branch"
          fi

          cat > README.md <<'EOF'
          # Benchmark Baselines

          This branch stores github-action-benchmark history for isonim-tui (M24).
          EOF
          touch .nojekyll

          git add README.md .nojekyll
          git commit -m "Initialize benchmark baseline store"

          if ! git push origin gh-pages; then
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
              echo "gh-pages baseline branch was created by another workflow"
            else
              echo "failed to create gh-pages baseline branch" >&2
              exit 1
            fi
          fi

  benchmark-linux:
    needs: benchmark-baseline-store
    runs-on: [self-hosted, benchmark]
    name: benchmark (isonim-tui, Linux)
    steps:
      # `just bench` compiles the benchmark binaries against the same sibling
      # repositories every other lane needs (`src-paths` in the Justfile, plus
      # the tree-sitter grammars the M19 highlighter `{.compile.}`s). A bare
      # `actions/checkout` put none of them on disk, so this job could only ever
      # have measured a build that did not compile -- exactly the defect
      # `ci.yml` was fixed for. Provision siblings the same single approved way:
      # `setup-dev-env` resolves `.github/sibling-repos` against the per-commit
      # workspace lock.
      #
      # The manifest repo holding the locks (metacraft-manifests) is private, so
      # `secrets.GITHUB_TOKEN` cannot read it. Mint an installation token from
      # the org's CI Token Provider app. The app id is an ORG VARIABLE and only
      # the private key is a secret -- `secrets.CI_TOKEN_PROVIDER_APP_ID` does
      # not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

      - name: Run benchmark suite
        run: |
          dev-exec just bench --quick

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: bench-results/
          retention-days: 30

      - name: Compare benchmarks (PR)
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "isonim-tui Performance (Linux)"
          tool: customSmallerIsBetter
          output-file-path: bench-results/benchmark_results.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: perf/bench
          alert-threshold: "120%"
          comment-always: true
          comment-on-alert: true
          save-data-file: false
          auto-push: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update baseline (main)
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: commit.gpgsign
          GIT_CONFIG_VALUE_0: "false"
        with:
          name: "isonim-tui Performance (Linux)"
          tool: customSmallerIsBetter
          output-file-path: bench-results/benchmark_results.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: perf/bench
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: false
          auto-push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Hard-failure gate: stricter than the 120% warning band.
      # See `metacraft-specs/policies/continuous-benchmarking.md` and
      # the M24 spec § "Hard-failure thresholds" for the table.
      - name: Hard-threshold gate
        if: always()
        run: |
          set -euo pipefail
          dev-exec bash scripts/check-hard-thresholds.sh \
            bench-results/benchmark_results.json

      # No `|| true`. These two calls previously swallowed their exit codes, so
      # a profiler that never ran -- or crashed -- looked exactly like one that
      # produced a flamegraph, and the "Upload flamegraphs" step below would
      # then find nothing and warn rather than fail. If profiling a regression
      # is worth doing at all, its failure is worth reporting.
      - name: Profile on regression
        if: failure()
        run: |
          set -euo pipefail
          dev-exec bash scripts/profile-on-regression.sh latency
          dev-exec bash scripts/profile-on-regression.sh cold_start

      - name: Upload flamegraphs on regression
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-flamegraphs
          path: bench-results/flamegraph-*.svg
          retention-days: 30

      - name: Cleanup binaries
        if: always()
        run: |
          rm -rf bench-results/_bin
